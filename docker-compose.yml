services:
  db:
    image: postgres:15
    container_name: Rotalume_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5325:5432"
    #ports:
     # - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      -  rotalume_nt

  backend:
    build: ./back_portal-cotacao
    container_name: Rotalume_back
    # Aplica migrations pendentes (ex.: Matriz ISS) antes de subir o servidor
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./back_portal-cotacao:/app

    environment:
      - PYTHONUNBUFFERED=1
      
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rotalume_nt
      # Rede interna do Compose: DNS estável para o Vite (Node) falar com o serviço "backend".
      # host.docker.internal:8000 costuma dar ECONNREFUSED no Docker Desktop/WSL2.
      - portal_api

  frontend:
    build: ./front_portal-cotacao
    container_name: Rotalume_front
    # Com bind mount, o node_modules vem do host — garante xlsx e demais deps antes do Vite.
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./front_portal-cotacao:/app
    environment:
      # Browser → Vite (5173) → proxy /__api → Django no container backend (rede portal_api).
      - VITE_USE_DEV_PROXY=1
      - VITE_DEV_PROXY_TARGET=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - rotalume_nt
      - portal_api

networks:
  rotalume_nt:
    external: true
  portal_api:
    driver: bridge

volumes:
  postgres_data:

